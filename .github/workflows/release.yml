name: Release
on:
  push:
    tags:
      - "v*"
permissions: {}
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-arm64
            suffix: darwin-arm64
          - os: macos-latest
            target: bun-darwin-x64
            suffix: darwin-x64
          - os: ubuntu-latest
            target: bun-linux-x64
            suffix: linux-x64
    timeout-minutes: 5
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        timeout-minutes: 5
      - timeout-minutes: 5
        run: bun install
      - name: Build
        timeout-minutes: 5
        env:
          BUILD_TARGET: ${{ matrix.target }}
          REF_NAME: ${{ github.ref_name }}
        run: bun build --compile --target="$BUILD_TARGET" --define __VERSION__="\"$REF_NAME\"" --outfile=say index.ts
      - name: Archive
        timeout-minutes: 5
        env:
          REF_NAME: ${{ github.ref_name }}
          SUFFIX: ${{ matrix.suffix }}
        run: tar czf "say-${REF_NAME}-${SUFFIX}.tar.gz" say
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 5
        with:
          name: say-${{ matrix.suffix }}
          path: say-${{ github.ref_name }}-${{ matrix.suffix }}.tar.gz
  release:
    needs: build
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        timeout-minutes: 5
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        timeout-minutes: 5
        with:
          files: "*.tar.gz"
