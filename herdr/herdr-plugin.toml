id = "hikaruegashira.say-hook"
name = "Say Hook"
version = "0.3.0"
min_herdr_version = "0.7.0"
description = "Speak the agent's first line aloud via the say-hook CLI when a Herdr agent finishes or gets blocked."
platforms = ["macos"]

[[events]]
on = "pane.agent_status_changed"
command = ["sh", "say-hook-speak.sh"]

[[actions]]
id = "install-claude-hook"
title = "Install Claude Hook"
command = ["sh", "say-hook-speak.sh", "--install-claude-hook"]

[[actions]]
id = "dry-run"
title = "Dry Run"
command = ["sh", "say-hook-speak.sh", "--dry-run"]

[[actions]]
id = "test"
title = "Speak Test Line"
command = ["sh", "say-hook-speak.sh", "--test"]
